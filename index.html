<title>Bruns Timer 60</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: ein einzelnes Gerät, zentriert, Zifferblatt oben, Tasten unten. Bewusst ein fester Bruns-Look in beiden Themes. */
:root{
  --room:#d9d6cf;
  --body:#e9e7e2;
  --body-edge:#cfccc5;
  --dial:#1b1b1a;
  --tick:#f2f1ee;
  --hand:#f5c400;
  --orange:#e8571c;
  --grey-key:#9b9890;
  --ink:#2b2a27;
  --muted:#77746c;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{
  margin:0;background:var(--room);color:var(--ink);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px;box-sizing:border-box;
}
.device{
  width:min(360px,100%);background:var(--body);border-radius:36px;
  padding:28px 24px 30px;box-sizing:border-box;
  box-shadow:inset 0 -3px 0 var(--body-edge),0 18px 40px rgba(40,36,28,.18);
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.brand{align-self:stretch;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .logo{width:43px;max-width:none;color:var(--ink)}
svg{width:100%;max-width:300px;height:auto;display:block}
.sliderbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slider{width:100%;max-width:260px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  border-radius:4px;transition:opacity .2s}
.slider:focus-visible{outline:3px solid var(--dial);outline-offset:3px}
.slider[aria-disabled="true"]{opacity:.45;cursor:default}
.readout{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.state{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-16px}
.keys{display:flex;gap:28px;align-items:flex-end}
.key{display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{border:0;border-radius:50%;cursor:pointer;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.15);
  transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
button:focus-visible{outline:3px solid var(--dial);outline-offset:3px}
#start{width:76px;height:76px;background:var(--orange)}
#reset{width:52px;height:52px;background:var(--grey-key)}
.device.ringing #start{animation:pulse .6s infinite alternate}
.switch{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.switch span.on{color:var(--ink);font-weight:600}
.slide{position:relative;width:54px;height:24px;border-radius:12px;background:var(--body-edge);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.18);border:0;cursor:pointer;padding:0}
.slide::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:18px;border-radius:9px;
  background:var(--grey-key);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.slide[aria-checked="true"]::after{left:25px;background:var(--orange)}
.slide:focus-visible{outline:3px solid var(--dial);outline-offset:3px}
@keyframes pulse{to{filter:brightness(1.2)}}
@media (prefers-reduced-motion:reduce){.device.ringing #start{animation:none}}
/* Telefon: das Gerät füllt den ganzen Bildschirm, randlos, Inhalte gleichmäßig über die Höhe verteilt. */
@media (max-width:500px){
  html,body{background:var(--body)}
  body{padding:0;min-height:100vh;min-height:100dvh}
  .device{width:100%;min-height:100vh;min-height:100dvh;border-radius:0;box-shadow:none;
    justify-content:space-evenly;gap:16px;
    padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px))
      max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .state{margin-top:-10px}
  .device>svg{max-width:min(300px,calc(100vh - 400px));max-width:min(300px,calc(100dvh - 400px))}
}
</style>
</head>

        <path transform="matrix(4.16667,0,0,4.16667,1508.39,1313.09)" d="M0,-39.685L27.213,0L27.213,-39.685L0,-39.685Z"/>
        <path transform="matrix(4.16667,0,0,4.16667,1510.75,1282.08)" d="M0,39.685L27.213,39.685L0,0L0,39.685Z"/>
        <path transform="matrix(4.16667,0,0,4.16667,1713.9,1147.73)" d="M0,71.582L32.861,71.582C36.8,71.582 41.194,70.931 46.045,69.629C49.593,68.685 52.913,66.789 56.006,63.94C59.098,61.092 61.515,57.561 63.257,53.345C64.998,49.129 65.869,43.197 65.869,35.547C65.869,30.664 65.283,26.042 64.111,21.68C62.939,17.318 61.051,13.493 58.447,10.205C55.843,6.918 52.547,4.394 48.56,2.637C44.572,0.879 39.339,0 32.861,0L0,0L0,71.582ZM27.637,16.211C33.366,16.211 37.467,17.611 39.941,20.41C42.415,23.21 43.652,28.402 43.652,35.986C43.652,41.716 43.098,45.858 41.992,48.413C40.885,50.969 39.355,52.759 37.402,53.784C35.449,54.81 32.161,55.322 27.539,55.322L22.119,55.322L22.119,16.211L27.637,16.211ZM71.441,71.582L131.793,71.582L131.793,55.371L93.609,55.371L93.609,41.26L128.033,41.26L128.033,26.66L93.609,26.66L93.609,15.283L130.719,15.283L130.719,0L71.441,0L71.441,71.582ZM160.217,71.582L160.217,42.529L162.17,42.529C164.188,42.529 165.995,43.083 167.59,44.189C168.762,45.036 170.096,46.875 171.594,49.707L183.417,71.582L208.41,71.582L197.698,50.84C197.178,49.798 196.145,48.315 194.6,46.393C193.054,44.47 191.876,43.216 191.062,42.629C189.859,41.75 187.939,40.871 185.305,39.99C188.594,39.242 191.184,38.298 193.073,37.158C196.036,35.368 198.365,33.032 200.059,30.151C201.753,27.27 202.6,23.845 202.6,19.873C202.6,15.316 201.493,11.45 199.279,8.276C197.065,5.103 194.152,2.93 190.539,1.758C186.926,0.586 181.701,0 174.865,0L138,0L138,71.582L160.217,71.582ZM160.217,14.453L169.934,14.453C173.97,14.453 176.721,15.072 178.186,16.309C179.65,17.546 180.383,19.32 180.383,21.631C180.383,23.193 179.919,24.577 178.991,25.781C178.063,26.986 176.867,27.734 175.402,28.027C172.505,28.679 170.552,29.004 169.543,29.004L160.217,29.004L160.217,14.453Z"/>
        <path transform="matrix(4.16667,0,0,4.16667,847.375,1387.89)" d="M0,-42.237L35.905,-42.237L-3.857,-0.782L-3.857,14.062L64.063,14.062L64.063,-1.319L22.415,-1.319L62.598,-43.214L62.598,-57.52L0,-57.52L0,-42.237ZM114.605,-13.857C114.605,-9.889 113.523,-6.824 111.358,-4.661C109.193,-2.498 106.207,-1.417 102.398,-1.417C98.557,-1.417 95.554,-2.514 93.39,-4.71C91.224,-6.905 90.143,-9.954 90.143,-13.857L90.143,-57.52L68.072,-57.52L68.072,-14.873C68.072,-11.359 68.756,-7.326 70.123,-2.772C70.969,0.059 72.54,2.808 74.835,5.475C77.13,8.142 79.661,10.2 82.428,11.647C85.194,13.095 88.637,14.062 92.755,14.551C96.872,15.038 100.673,15.283 104.156,15.283C110.178,15.283 115.338,14.485 119.635,12.891C122.727,11.753 125.681,9.777 128.497,6.963C131.312,4.15 133.38,0.864 134.698,-2.894C136.017,-6.65 136.676,-10.644 136.676,-14.873L136.676,-57.52L114.605,-57.52L114.605,-13.857Z"/>
      </g>
    </svg>
    <span id="unit">60 min</span>
  </div>
  <div class="switch">
    <span id="lblH" class="on">Stunde</span>
    <button class="slide" id="mode" role="switch" aria-checked="false" aria-label="Zwischen Stunde und Minute wechseln"></button>
    <span id="lblM">Minute</span>
  </div>
  <svg viewBox="0 0 300 300" aria-label="Zifferblatt">
    <circle cx="150" cy="150" r="146" fill="var(--dial)"/>
    <path id="sector" fill="var(--orange)" opacity=".85"/>
    <g id="ticks"></g>
    <line id="hand" x1="150" y1="150" x2="150" y2="34" stroke="var(--hand)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="150" r="9" fill="var(--hand)"/>
    <circle cx="150" cy="150" r="3" fill="var(--dial)"/>
  </svg>
  <div class="readout" id="readout">60:00</div>
  <div class="state" id="state">Bereit</div>
  <div class="sliderbox">
    <svg class="slider" id="slider" viewBox="0 0 260 52" role="slider" tabindex="0"
      aria-label="Laufzeit einstellen" aria-valuemin="1" aria-valuemax="60" aria-valuenow="60" aria-valuetext="60 Minuten">
      <line x1="14" y1="16" x2="246" y2="16" stroke="var(--body-edge)" stroke-width="4" stroke-linecap="round"/>
      <line id="fill" x1="14" y1="16" x2="246" y2="16" stroke="var(--orange)" stroke-width="4" stroke-linecap="round"/>
      <g id="scale"></g>
      <g id="knob">
        <rect x="-8" y="2" width="16" height="28" rx="3" fill="var(--dial)"/>
        <line x1="0" y1="8" x2="0" y2="24" stroke="var(--hand)" stroke-width="2"/>
      </g>
    </svg>
    Zeit einstellen
  </div>
  <div class="keys">
    <div class="key"><button id="reset" aria-label="Zurücksetzen"></button>Reset</div>
    <div class="key"><button id="start" aria-label="Start oder Stopp"></button>Start / Stopp</div>
  </div>
</div>

<script>
// SCALE: Sekunden auf dem Zifferblatt. UNIT: Sekunden je Schritt des Schiebereglers.
let SCALE=3600, UNIT=60, setVal=60; const cx=150, cy=150;
const ticks=document.getElementById('ticks');
const ns='http://www.w3.org/2000/svg';
for(let m=0;m<60;m++){
  const a=m/60*2*Math.PI, major=m%5===0;
  const r1=major?120:128, r2=136;
  const l=document.createElementNS(ns,'line');
  l.setAttribute('x1',cx+r1*Math.sin(a));l.setAttribute('y1',cy-r1*Math.cos(a));
  l.setAttribute('x2',cx+r2*Math.sin(a));l.setAttribute('y2',cy-r2*Math.cos(a));
  l.setAttribute('stroke','var(--tick)');l.setAttribute('stroke-width',major?3:1.2);
  ticks.appendChild(l);
  if(major){
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',cx+102*Math.sin(a));t.setAttribute('y',cy-102*Math.cos(a)+5);
    t.setAttribute('text-anchor','middle');t.setAttribute('fill','var(--tick)');
    t.setAttribute('font-family','Archivo, Helvetica, Arial, sans-serif');
    t.setAttribute('font-size','14');t.textContent=m;ticks.appendChild(t);
  }
}
let remaining=setVal*UNIT, running=false, endAt=0, raf=0, audio=null, wake=null;
const $=id=>document.getElementById(id);
function draw(){
  const f=Math.min(1,remaining/SCALE), a=f*2*Math.PI, R=140;
  if(f>=0.9999){$('sector').setAttribute('d',`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-0.01} ${cy-R}Z`);}
  else if(f<=0){$('sector').setAttribute('d','');}
  else{
    const x=cx+R*Math.sin(a), y=cy-R*Math.cos(a);
    $('sector').setAttribute('d',`M${cx} ${cy}L${cx} ${cy-R}A${R} ${R} 0 ${f>.5?1:0} 1 ${x} ${y}Z`);
  }
  $('hand').setAttribute('transform',`rotate(${f*360} ${cx} ${cy})`);
  const s=Math.ceil(remaining);
  $('readout').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function tick(){
  remaining=Math.max(0,(endAt-Date.now())/1000);
  draw();
  if(remaining<=0){running=false;lockWheel(false);ring();return;}
  raf=requestAnimationFrame(tick);
}
function ensureAudio(){
  if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audio&&audio.state==='suspended')audio.resume();
}
function beep(){
  if(!audio)return;
  const t=audio.currentTime;
  [0,0.35,0.7].forEach(d=>{
    const o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=880;o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.4,t+d+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.25);
    o.start(t+d);o.stop(t+d+0.3);
  });
}
let ringTimer=0;
/* Vibrationsalarm im Takt der drei Töne, wiederholt bis Start oder Reset. */
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function alarm(){beep();buzz([250,100,250,100,250]);}
function ring(){
  $('dev').classList.add('ringing');$('state').textContent='Zeit ist um';
  alarm();ringTimer=setInterval(alarm,1500);
}
function stopRing(){
  if(ringTimer){clearInterval(ringTimer);ringTimer=0;buzz(0);}
  $('dev').classList.remove('ringing');
}
async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
function ready(){running=false;cancelAnimationFrame(raf);stopRing();lockWheel(false);
  remaining=setVal*UNIT;draw();$('state').textContent='Bereit';}
$('start').onclick=()=>{
  ensureAudio();
  if(remaining<=0){ready();return;}
  if(running){running=false;cancelAnimationFrame(raf);lockWheel(false);$('state').textContent='Pause';
    try{wake&&wake.release()}catch(e){}}
  else{running=true;lockWheel(true);endAt=Date.now()+remaining*1000;$('state').textContent='Läuft';lock();tick();}
};
$('reset').onclick=ready;
$('mode').onclick=()=>{
  const minute=$('mode').getAttribute('aria-checked')!=='true';
  $('mode').setAttribute('aria-checked',String(minute));
  SCALE=minute?60:3600;UNIT=minute?1:60;
  $('unit').textContent=minute?'60 s':'60 min';
  $('lblH').classList.toggle('on',!minute);$('lblM').classList.toggle('on',minute);
  ariaWheel();ready();
};

/* Schieberegler: p ist die Stellung als Kommazahl. Beim Ziehen folgt p weich dem Finger, beim Loslassen gleitet p auf die nächste ganze Zahl. */
const W=$('slider'), LO=1, HI=60, X0=14, X1=246;
const xOf=val=>X0+(val-LO)/(HI-LO)*(X1-X0);
for(let m=5;m<=60;m+=5){
  const x=xOf(m), major=m%10===0, l=document.createElementNS(ns,'line');
  l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',33);l.setAttribute('y2',major?39:36);
  l.setAttribute('stroke','var(--muted)');l.setAttribute('stroke-width',1);$('scale').appendChild(l);
  if(major){
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',x);t.setAttribute('y',50);t.setAttribute('text-anchor','middle');
    t.setAttribute('fill','var(--muted)');t.setAttribute('font-size','9');
    t.setAttribute('font-family','Archivo, Helvetica, Arial, sans-serif');t.textContent=m;$('scale').appendChild(t);
  }
}
let p=setVal, goal=setVal, drag=null, wheelRaf=0, lastT=0, lastClick=0, wheelLocked=false;
function renderWheel(){
  const x=xOf(p);
  $('fill').setAttribute('x2',x);$('knob').setAttribute('transform',`translate(${x} 0)`);
}
function ariaWheel(){
  W.setAttribute('aria-valuenow',setVal);
  W.setAttribute('aria-valuetext',setVal+(UNIT===60?(setVal===1?' Minute':' Minuten'):(setVal===1?' Sekunde':' Sekunden')));
}
function click(){
  const now=performance.now();if(now-lastClick<28)return;lastClick=now;
  if(audio&&audio.state==='running'){
    const n=Math.floor(audio.sampleRate*0.01), b=audio.createBuffer(1,n,audio.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
    const s=audio.createBufferSource(), f=audio.createBiquadFilter(), g=audio.createGain();
    f.type='bandpass';f.frequency.value=3200;f.Q.value=1.2;g.gain.value=0.25;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(audio.destination);s.start();
  }
  try{navigator.vibrate&&navigator.vibrate(4)}catch(e){}
}
function applyP(){
  const val=Math.min(HI,Math.max(LO,Math.round(p)));
  if(val!==setVal){
    setVal=val;click();ariaWheel();
    stopRing();remaining=setVal*UNIT;draw();$('state').textContent='Bereit';
  }
}
function wheelLoop(t){
  const dt=lastT?Math.min(2,(t-lastT)/16.67):1;lastT=t;
  const tg=drag?drag.target:goal;
  p+=(tg-p)*(1-Math.pow(drag?0.45:0.72,dt));
  if(!drag&&Math.abs(goal-p)<0.002){p=goal;renderWheel();applyP();wheelRaf=0;lastT=0;return;}
  renderWheel();applyP();
  wheelRaf=requestAnimationFrame(wheelLoop);
}
function kick(){if(!wheelRaf){lastT=0;wheelRaf=requestAnimationFrame(wheelLoop);}}
function valAt(clientX){
  const r=W.getBoundingClientRect(), x=(clientX-r.left)*260/r.width;
  return Math.min(HI,Math.max(LO,LO+(x-X0)/(X1-X0)*(HI-LO)));
}
function lockWheel(on){wheelLocked=on;W.setAttribute('aria-disabled',String(on));}
W.addEventListener('pointerdown',e=>{
  if(wheelLocked)return;
  ensureAudio();try{W.setPointerCapture(e.pointerId)}catch(err){}
  drag={target:valAt(e.clientX)};kick();
});
W.addEventListener('pointermove',e=>{if(drag)drag.target=valAt(e.clientX);});
function endDrag(){if(!drag)return;goal=Math.round(drag.target);drag=null;kick();}
W.addEventListener('pointerup',endDrag);
W.addEventListener('pointercancel',endDrag);
W.addEventListener('wheel',e=>{
  if(wheelLocked)return;
  e.preventDefault();ensureAudio();
  const d=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:-e.deltaY)*(e.deltaMode===1?16:1);
  goal=Math.min(HI,Math.max(LO,goal+Math.sign(d)*Math.max(1,Math.round(Math.abs(d)/40))));kick();
},{passive:false});
W.addEventListener('keydown',e=>{
  if(wheelLocked)return;
  const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:5,PageDown:-5}[e.key];
  let g=null;
  if(k)g=goal+k;else if(e.key==='Home')g=LO;else if(e.key==='End')g=HI;
  if(g===null)return;
  e.preventDefault();ensureAudio();goal=Math.min(HI,Math.max(LO,g));kick();
});
/* Vollbild: einmal beim ersten Antippen auf dem Telefon, sofern das Gerät es erlaubt. */
let fullTried=false;
document.addEventListener('pointerup',e=>{
  if(fullTried||e.pointerType!=='touch')return;
  fullTried=true;
  if(matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)return;
  const d=document.documentElement, f=d.requestFullscreen||d.webkitRequestFullscreen;
  if(!f||document.fullscreenElement||document.webkitFullscreenElement)return;
  try{const r=f.call(d,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{});}catch(err){}
},{passive:true});
renderWheel();ariaWheel();draw();
</script>
